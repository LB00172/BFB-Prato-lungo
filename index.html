<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brigata Fabio Bandone</title>

  <!-- Tailwind (build browser self-hosted, nessun CDN) -->
  <script src="vendor/tailwind.js"></script>
  <!-- Font self-hosted (nessun Google Fonts) -->
  <link href="vendor/fonts.css" rel="stylesheet">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2D392C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    .font-rustic {
      font-family: 'Special Elite', system-ui, -apple-system, sans-serif;
    }
    .font-clean {
      font-family: 'Courier Prime', monospace;
    }
    :root {
      --color-military: #2D392C;
      --color-sage: #8F9E8B;
      --color-wood: #5C4A3C;
      --color-fire: #D97706;
    }
  </style>
</head>
<body class="bg-[#F0F4F1] text-[#2D392C] font-clean antialiased min-h-screen select-none">
  <div id="root"></div>

  <!-- Librerie React self-hosted (nessun CDN) -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>

  <!-- Config e sincronizzazione cloud opzionale (Firebase). Non fanno rete al caricamento:
       Firebase viene scaricato solo quando ci si connette, e solo se configurato. -->
  <script src="firebase-config.js"></script>
  <script src="firebase-sync.js"></script>

  <!-- Logica dell'app: App.js è generato da App.jsx (JS puro, niente Babel a runtime) -->
  <script src="App.js"></script>

  <!-- Registrazione Service Worker per uso Offline -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registrato:', reg.scope))
          .catch(err => console.log('Errore SW:', err));
      });
    }
    // Chiede al browser di conservare i dati (cache + localStorage) e non
    // cancellarli sotto pressione di spazio: utile per non perdere tutto
    // prima di partire per il campo.
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist();
    }
  </script>
</body>
</html>
