<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brigata Fabio Bandone</title>

  <!-- Tailwind (build browser self-hosted, nessun CDN) -->
  <script src="vendor/tailwind.js"></script>
  <!-- Font self-hosted (nessun Google Fonts) -->
  <link href="vendor/fonts.css" rel="stylesheet">

  <link rel="manifest" href="manifest.json">
  <!-- Icona per l'installazione su iPhone/iPad (iOS ignora le icone del manifest) -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#2D392C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    .font-rustic {
      font-family: 'Special Elite', system-ui, -apple-system, sans-serif;
    }
    .font-clean {
      font-family: 'Courier Prime', monospace;
    }
    :root {
      --color-military: #2D392C;
      --color-sage: #8F9E8B;
      --color-wood: #5C4A3C;
      --color-fire: #D97706;
    }
    /* Desktop / browser: la colonna dell'app resta identica, ma lo spazio
       attorno prende un fondo più scuro così si stacca, e il testo torna
       selezionabile (su mobile resta bloccato per evitare selezioni
       accidentali col dito). */
    @media (min-width: 768px) {
      body {
        background-color: #D3DCD4;
        -webkit-user-select: text;
        user-select: text;
      }
    }

    /* Menù: foglio a righe. L'altezza della riga combacia con il passo delle
       righe disegnate, così ogni pietanza scritta ci finisce sopra.
       background-attachment: local fa scorrere le righe insieme al testo. */
    .lined-paper {
      --riga: 28px;
      font-size: 14px;
      line-height: var(--riga);
      min-height: calc(var(--riga) * 8);
      background-color: #F7FAF7;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent calc(var(--riga) - 1px),
        rgba(143, 158, 139, 0.45) calc(var(--riga) - 1px),
        rgba(143, 158, 139, 0.45) var(--riga)
      );
      background-attachment: local;
      /* Il padding verticale è un multiplo della riga: il testo resta allineato */
      padding-top: 4px;
      padding-bottom: 4px;
    }
    :root[data-theme="dark"] .lined-paper {
      background-color: #2c352b !important;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent calc(var(--riga) - 1px),
        rgba(143, 158, 139, 0.28) calc(var(--riga) - 1px),
        rgba(143, 158, 139, 0.28) var(--riga)
      ) !important;
    }

    /* ======================================================================
       TEMA SCURO
       ======================================================================
       L'attributo data-theme="dark" viene messo su <html> dall'app (voce
       Impostazioni → Aspetto). I colori dell'app sono scritti nelle classi
       Tailwind, quindi qui si rimappano quelle classi: si intercetta il
       nome della classe (anche nelle varianti con trasparenza, es.
       bg-[#F0F4F1]/50) e si sostituisce il colore. Così il tema scuro non
       richiede di riscrivere la grafica di ogni schermata.
       Nota: i colori già scuri (verde militare, legno, ambra) restano come
       sono: su fondo scuro funzionano e mantengono l'identità dell'app. */
    :root[data-theme="dark"] { color-scheme: dark; }

    :root[data-theme="dark"] body,
    :root[data-theme="dark"] [class*="bg-[#F0F4F1]"] { background-color: #1a201a !important; }
    @media (min-width: 768px) {
      :root[data-theme="dark"] body { background-color: #0f130f !important; }
    }
    /* Schede: il bianco diventa un verde molto scuro, un gradino sopra il fondo */
    :root[data-theme="dark"] [class*="bg-white"]:not([class*="hover:bg-white"]) { background-color: #20271f !important; }
    /* Pannelli interni (erano bianchi sporchi/verdini) */
    :root[data-theme="dark"] .bg-\[\#F0F4F1\]\/50,
    :root[data-theme="dark"] .bg-\[\#F0F4F1\]\/60 { background-color: #2c352b !important; }
    /* Pannelli tenui col verde militare trasparente: sul fondo scuro
       sparirebbero, quindi diventano un grigio-verde appena percettibile */
    :root[data-theme="dark"] [class*="bg-[#2D392C]/"] { background-color: #2f382d !important; }
    :root[data-theme="dark"] [class*="bg-gray-200"] { background-color: #2c352b !important; }
    :root[data-theme="dark"] [class*="hover:bg-[#E2EAE4]"]:hover { background-color: #333d32 !important; }

    /* Testi */
    :root[data-theme="dark"] body,
    :root[data-theme="dark"] [class*="text-[#2D392C]"] { color: #dde6dc !important; }
    :root[data-theme="dark"] [class*="text-gray-700"],
    :root[data-theme="dark"] [class*="text-gray-600"] { color: #c3cdc2 !important; }
    :root[data-theme="dark"] [class*="text-gray-500"] { color: #a3afa2 !important; }
    :root[data-theme="dark"] [class*="text-gray-400"],
    :root[data-theme="dark"] [class*="text-gray-300"] { color: #8c988b !important; }
    :root[data-theme="dark"] [class*="text-[#5C4A3C]"] { color: #c9a683 !important; }
    :root[data-theme="dark"] [class*="text-red-700"] { color: #f08a8a !important; }

    /* Bordi */
    :root[data-theme="dark"] [class*="border-[#8F9E8B]"] { border-color: #414b40 !important; }
    :root[data-theme="dark"] [class*="border-[#2D392C]"] { border-color: #4a5a48 !important; }
    :root[data-theme="dark"] [class*="border-gray-200"],
    :root[data-theme="dark"] [class*="border-gray-300"] { border-color: #3a443a !important; }

    /* Campi di inserimento: senza questo il testo digitato resterebbe nero */
    :root[data-theme="dark"] input,
    :root[data-theme="dark"] textarea,
    :root[data-theme="dark"] select { color: #dde6dc !important; }
    :root[data-theme="dark"] input::placeholder,
    :root[data-theme="dark"] textarea::placeholder { color: #7e8a7d !important; }
    /* Le opzioni delle tendine sono disegnate dal sistema */
    :root[data-theme="dark"] option { background-color: #242c23; color: #dde6dc; }
  </style>

  <!-- Tema applicato prima di disegnare la pagina, così aprendo l'app non si
       vede il lampo chiaro prima di passare allo scuro. -->
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('cambusa_theme') || 'auto';
        var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.setAttribute('data-theme', 'dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#1a201a');
        }
      } catch (e) { /* niente tema: resta chiaro */ }
    })();
  </script>
</head>
<body class="bg-[#F0F4F1] text-[#2D392C] font-clean antialiased min-h-screen select-none">
  <div id="root"></div>

  <!-- Librerie React self-hosted (nessun CDN) -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>

  <!-- Config e sincronizzazione cloud opzionale (Firebase). Non fanno rete al caricamento:
       Firebase viene scaricato solo quando ci si connette, e solo se configurato. -->
  <script src="firebase-config.js"></script>
  <script src="sync-merge.js"></script>
  <script src="pdf-ricordo.js"></script>
  <script src="firebase-sync.js"></script>

  <!-- Logica dell'app: App.js è generato da App.jsx (JS puro, niente Babel a runtime) -->
  <script src="App.js"></script>

  <!-- Registrazione Service Worker per uso Offline -->
  <script>
    if ('serviceWorker' in navigator) {
      // Se la pagina è già controllata da un SW, quando ne arriva uno nuovo
      // (nuova versione dell'app) ricarichiamo una volta sola, così l'utente
      // vede subito gli aggiornamenti senza svuotare la cache a mano.
      const hadController = !!navigator.serviceWorker.controller;
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing || !hadController) return;
        refreshing = true;
        window.location.reload();
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => { if (reg.update) reg.update(); console.log('Service Worker registrato:', reg.scope); })
          .catch(err => console.log('Errore SW:', err));
      });
    }
    // Chiede al browser di conservare i dati (cache + localStorage) e non
    // cancellarli sotto pressione di spazio: utile per non perdere tutto
    // prima di partire per il campo.
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist();
    }
  </script>
</body>
</html>
